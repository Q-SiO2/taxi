# Zero-cost, temporary user-testing Blueprint. This intentionally combines the
# API and background loops in one free web process and uses the public Valhalla
# fair-use demo. It is forbidden for production or sensitive real-user data.
previews:
  generation: "off"

services:
  - type: web
    name: taximobile-free-test-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m taximobile_api.operations.render_entrypoint free-staging
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: TAXIMOBILE_ENV
        value: staging
      - key: TAXIMOBILE_PROCESS_ROLE
        value: all
      - key: TAXIMOBILE_CLIENT_COMPATIBILITY_ENFORCED
        value: "true"
      - key: TAXIMOBILE_CLIENT_POLICY_REVISION
        value: synthetic-test-1
      - key: TAXIMOBILE_CLIENT_ANDROID_PASSENGER_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_ANDROID_PASSENGER_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_ANDROID_DRIVER_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_ANDROID_DRIVER_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_IOS_PASSENGER_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_IOS_PASSENGER_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_IOS_DRIVER_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_IOS_DRIVER_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_WEB_APPLICANT_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_WEB_APPLICANT_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_WEB_OPERATIONS_MINIMUM_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_CLIENT_WEB_OPERATIONS_RECOMMENDED_VERSION
        value: 1.0.0
      - key: TAXIMOBILE_LEGACY_ADMIN_API_ENABLED
        value: "false"
      - key: TAXIMOBILE_JWT_SECRET
        generateValue: true
      - key: TAXIMOBILE_MONITORING_TOKEN
        generateValue: true
      - key: TAXIMOBILE_OPERATIONS_PASSWORD_LOGIN_ENABLED
        value: "true"
      - key: TAXIMOBILE_OPERATIONS_SECURE_COOKIE_ENABLED
        value: "false"
      - key: TAXIMOBILE_FREE_TEST_ADMIN_EMAIL
        sync: false
      - key: TAXIMOBILE_FREE_TEST_ADMIN_PASSWORD
        sync: false
      - key: TAXIMOBILE_ROUTING_PROVIDER
        value: valhalla
      - key: TAXIMOBILE_ROUTING_BASE_URL
        value: https://valhalla1.openstreetmap.de
      - key: TAXIMOBILE_ROUTING_TIMEOUT_SECONDS
        value: "8"
      - key: TAXIMOBILE_ROUTING_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: TAXIMOBILE_MATCHING_POLL_SECONDS
        value: "2"
      - key: TAXIMOBILE_OUTBOX_POLL_SECONDS
        value: "2"
      - key: TAXIMOBILE_CREDENTIAL_POLL_SECONDS
        value: "300"
      - key: TAXIMOBILE_ANALYTICS_POLL_SECONDS
        value: "300"
      - key: TAXIMOBILE_CASE_ALERT_POLL_SECONDS
        value: "60"
      - key: TAXIMOBILE_CASE_ALERT_MAX_DELIVERY_ATTEMPTS
        value: "8"
      - key: TAXIMOBILE_CASE_PAGER_TIMEOUT_SECONDS
        value: "5"
      - key: TAXIMOBILE_CASE_RETENTION_POLL_SECONDS
        value: "3600"
      - key: TAXIMOBILE_CASE_RETENTION_BATCH_SIZE
        value: "100"
      # External paging is intentionally absent on the zero-cost demo. Durable
      # alerts remain visible in the scoped operations console; this is not a
      # live-pilot safety arrangement.
      # Cash is ready without configuration. Enable external bank/M-Wallet
      # transfer only after adding verified recipient settings in Render.
      - key: TAXIMOBILE_MANUAL_TRANSFER_ENABLED
        value: "false"
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: taximobile-free-test-db
          property: connectionString

databases:
  - name: taximobile-free-test-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: taximobile_free_test
    user: taximobile_free_test
    ipAllowList: []
