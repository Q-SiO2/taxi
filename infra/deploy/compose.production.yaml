name: taximobile-production

x-common-environment: &common-environment
  TAXIMOBILE_ENV: production
  TAXIMOBILE_DATABASE_URL: ${TAXIMOBILE_DATABASE_URL:?Set the managed PostgreSQL/PostGIS URL through the deployment secret boundary}
  TAXIMOBILE_DATABASE_POOL_SIZE: ${TAXIMOBILE_DATABASE_POOL_SIZE:-5}
  TAXIMOBILE_DATABASE_POOL_MAX_OVERFLOW: ${TAXIMOBILE_DATABASE_POOL_MAX_OVERFLOW:-10}
  TAXIMOBILE_DATABASE_POOL_TIMEOUT_SECONDS: ${TAXIMOBILE_DATABASE_POOL_TIMEOUT_SECONDS:-30}
  TAXIMOBILE_MONITORING_TOKEN: ${TAXIMOBILE_MONITORING_TOKEN:?Set a separate 32+ character monitoring token}
  TAXIMOBILE_LOG_FILE_MAX_BYTES: ${TAXIMOBILE_LOG_FILE_MAX_BYTES:-10485760}
  TAXIMOBILE_LOG_FILE_BACKUP_COUNT: ${TAXIMOBILE_LOG_FILE_BACKUP_COUNT:-5}
  TAXIMOBILE_MATCHING_RADIUS_METERS: ${TAXIMOBILE_MATCHING_RADIUS_METERS:-3000}
  TAXIMOBILE_MATCHING_LOCATION_FRESHNESS_SECONDS: ${TAXIMOBILE_MATCHING_LOCATION_FRESHNESS_SECONDS:-30}
  TAXIMOBILE_MATCHING_CANDIDATE_LIMIT: ${TAXIMOBILE_MATCHING_CANDIDATE_LIMIT:-10}
  TAXIMOBILE_MATCHING_IDLE_CAP_SECONDS: ${TAXIMOBILE_MATCHING_IDLE_CAP_SECONDS:-1800}
  TAXIMOBILE_MATCHING_FAIRNESS_LOOKBACK_HOURS: ${TAXIMOBILE_MATCHING_FAIRNESS_LOOKBACK_HOURS:-24}
  TAXIMOBILE_MATCHING_ASSUMED_PICKUP_SPEED_MPS: ${TAXIMOBILE_MATCHING_ASSUMED_PICKUP_SPEED_MPS:-6.944}
  TAXIMOBILE_MATCHING_PROXIMITY_WEIGHT: ${TAXIMOBILE_MATCHING_PROXIMITY_WEIGHT:-0.55}
  TAXIMOBILE_MATCHING_IDLE_WEIGHT: ${TAXIMOBILE_MATCHING_IDLE_WEIGHT:-0.30}
  TAXIMOBILE_MATCHING_FAIRNESS_WEIGHT: ${TAXIMOBILE_MATCHING_FAIRNESS_WEIGHT:-0.15}
  TAXIMOBILE_MATCHING_ALGORITHM_VERSION: ${TAXIMOBILE_MATCHING_ALGORITHM_VERSION:-mvp-v1}
  TAXIMOBILE_MATCHING_TIMEOUT_SECONDS: ${TAXIMOBILE_MATCHING_TIMEOUT_SECONDS:-300}
  TAXIMOBILE_RIDE_OFFER_SECONDS: ${TAXIMOBILE_RIDE_OFFER_SECONDS:-45}
  TAXIMOBILE_DRIVER_DOCUMENT_STORAGE_ROOT: /var/lib/taximobile/driver-documents
  TAXIMOBILE_DRIVER_DOCUMENT_ENCRYPTION_KEY: ${TAXIMOBILE_DRIVER_DOCUMENT_ENCRYPTION_KEY:?Set an independent base64url-encoded 32-byte driver-document encryption key}
  TAXIMOBILE_DRIVER_DOCUMENT_CLAMAV_HOST: clamav
  TAXIMOBILE_DRIVER_DOCUMENT_CLAMAV_PORT: "3310"
  TAXIMOBILE_DRIVER_DOCUMENT_CLAMAV_TIMEOUT_SECONDS: ${TAXIMOBILE_DRIVER_DOCUMENT_CLAMAV_TIMEOUT_SECONDS:-10}
  TAXIMOBILE_DRIVER_DOCUMENT_MAX_BYTES: ${TAXIMOBILE_DRIVER_DOCUMENT_MAX_BYTES:-10485760}

x-api-environment: &api-environment
  <<: *common-environment
  TAXIMOBILE_JWT_SECRET: ${TAXIMOBILE_JWT_SECRET:?Set a 32+ character JWT secret through the deployment secret boundary}
  TAXIMOBILE_CLIENT_COMPATIBILITY_ENFORCED: "true"
  TAXIMOBILE_CLIENT_POLICY_REVISION: ${TAXIMOBILE_CLIENT_POLICY_REVISION:-baseline-1}
  TAXIMOBILE_CLIENT_ANDROID_PASSENGER_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_ANDROID_PASSENGER_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_ANDROID_PASSENGER_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_ANDROID_PASSENGER_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_ANDROID_DRIVER_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_ANDROID_DRIVER_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_ANDROID_DRIVER_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_ANDROID_DRIVER_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_IOS_PASSENGER_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_IOS_PASSENGER_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_IOS_PASSENGER_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_IOS_PASSENGER_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_IOS_DRIVER_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_IOS_DRIVER_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_IOS_DRIVER_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_IOS_DRIVER_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_WEB_APPLICANT_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_WEB_APPLICANT_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_WEB_APPLICANT_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_WEB_APPLICANT_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_WEB_OPERATIONS_MINIMUM_VERSION: ${TAXIMOBILE_CLIENT_WEB_OPERATIONS_MINIMUM_VERSION:-1.0.0}
  TAXIMOBILE_CLIENT_WEB_OPERATIONS_RECOMMENDED_VERSION: ${TAXIMOBILE_CLIENT_WEB_OPERATIONS_RECOMMENDED_VERSION:-1.0.0}
  TAXIMOBILE_LEGACY_ADMIN_API_ENABLED: "false"
  TAXIMOBILE_OPERATIONS_MFA_ENCRYPTION_KEY: ${TAXIMOBILE_OPERATIONS_MFA_ENCRYPTION_KEY:?Set an independent base64url-encoded 32-byte operations MFA encryption key}
  TAXIMOBILE_OPERATIONS_SECURE_COOKIE_ENABLED: "true"
  # The fixed internal host exists only on the optional internal monitoring
  # network. The public reverse proxy must continue to accept only public hosts.
  TAXIMOBILE_ALLOWED_HOSTS: taximobile-api-metrics,${TAXIMOBILE_ALLOWED_HOSTS:?Set the public API host allowlist}
  TAXIMOBILE_CORS_ORIGINS: ${TAXIMOBILE_CORS_ORIGINS:-}
  TAXIMOBILE_ROUTING_PROVIDER: ${TAXIMOBILE_ROUTING_PROVIDER:?Set valhalla or graphhopper}
  TAXIMOBILE_ROUTING_BASE_URL: ${TAXIMOBILE_ROUTING_BASE_URL:?Set the selected private routing service URL}
  TAXIMOBILE_ROUTING_TIMEOUT_SECONDS: ${TAXIMOBILE_ROUTING_TIMEOUT_SECONDS:-5}
  TAXIMOBILE_ROUTING_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_ROUTING_RATE_LIMIT_PER_MINUTE:-30}
  TAXIMOBILE_GEOCODING_PROVIDER: ${TAXIMOBILE_GEOCODING_PROVIDER:-disabled}
  TAXIMOBILE_GEOCODING_BASE_URL: ${TAXIMOBILE_GEOCODING_BASE_URL:-}
  TAXIMOBILE_GEOCODING_TIMEOUT_SECONDS: ${TAXIMOBILE_GEOCODING_TIMEOUT_SECONDS:-5}
  TAXIMOBILE_GEOCODING_USER_AGENT: "${TAXIMOBILE_GEOCODING_USER_AGENT:-TaxiMobile/0.1 (https://github.com/Q-SiO2/taxi)}"
  TAXIMOBILE_PLACE_SEARCH_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_PLACE_SEARCH_RATE_LIMIT_PER_MINUTE:-20}
  TAXIMOBILE_PLACE_REVERSE_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_PLACE_REVERSE_RATE_LIMIT_PER_MINUTE:-30}
  TAXIMOBILE_REGISTRATION_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_REGISTRATION_RATE_LIMIT_PER_MINUTE:-5}
  TAXIMOBILE_LOGIN_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
  TAXIMOBILE_RIDE_CREATION_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_RIDE_CREATION_RATE_LIMIT_PER_MINUTE:-5}
  TAXIMOBILE_RIDE_MESSAGE_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_RIDE_MESSAGE_RATE_LIMIT_PER_MINUTE:-12}
  TAXIMOBILE_SUPPORT_TICKET_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_SUPPORT_TICKET_RATE_LIMIT_PER_MINUTE:-5}
  TAXIMOBILE_LOCATION_UPDATE_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_LOCATION_UPDATE_RATE_LIMIT_PER_MINUTE:-60}
  TAXIMOBILE_VERIFICATION_SUBMISSION_RATE_LIMIT_PER_HOUR: ${TAXIMOBILE_VERIFICATION_SUBMISSION_RATE_LIMIT_PER_HOUR:-5}
  TAXIMOBILE_MANUAL_TRANSFER_ENABLED: ${TAXIMOBILE_MANUAL_TRANSFER_ENABLED:-false}
  TAXIMOBILE_TRANSFER_RECIPIENT_NAME: ${TAXIMOBILE_TRANSFER_RECIPIENT_NAME:-}
  TAXIMOBILE_TRANSFER_BANK_ACCOUNT: ${TAXIMOBILE_TRANSFER_BANK_ACCOUNT:-}
  TAXIMOBILE_TRANSFER_WALLET_ID: ${TAXIMOBILE_TRANSFER_WALLET_ID:-}
  TAXIMOBILE_DRIVER_DOCUMENT_UPLOAD_RATE_LIMIT_PER_HOUR: ${TAXIMOBILE_DRIVER_DOCUMENT_UPLOAD_RATE_LIMIT_PER_HOUR:-20}
  TAXIMOBILE_DRIVER_DOCUMENT_ACCESS_RATE_LIMIT_PER_MINUTE: ${TAXIMOBILE_DRIVER_DOCUMENT_ACCESS_RATE_LIMIT_PER_MINUTE:-30}

x-worker-environment: &worker-environment
  <<: *common-environment
  TAXIMOBILE_FIREBASE_PROJECT_ID: ${TAXIMOBILE_FIREBASE_PROJECT_ID:?Set the production Firebase project ID}
  TAXIMOBILE_FCM_TIMEOUT_SECONDS: ${TAXIMOBILE_FCM_TIMEOUT_SECONDS:-5}
  TAXIMOBILE_OUTBOX_POLL_SECONDS: ${TAXIMOBILE_OUTBOX_POLL_SECONDS:-1}
  TAXIMOBILE_OUTBOX_MAX_ATTEMPTS: ${TAXIMOBILE_OUTBOX_MAX_ATTEMPTS:-8}
  TAXIMOBILE_MATCHING_POLL_SECONDS: ${TAXIMOBILE_MATCHING_POLL_SECONDS:-1}
  TAXIMOBILE_CREDENTIAL_POLL_SECONDS: ${TAXIMOBILE_CREDENTIAL_POLL_SECONDS:-60}
  TAXIMOBILE_CREDENTIAL_EXPIRY_WARNING_DAYS: ${TAXIMOBILE_CREDENTIAL_EXPIRY_WARNING_DAYS:-30}
  TAXIMOBILE_ANALYTICS_POLL_SECONDS: ${TAXIMOBILE_ANALYTICS_POLL_SECONDS:-300}
  TAXIMOBILE_CASE_ALERT_POLL_SECONDS: ${TAXIMOBILE_CASE_ALERT_POLL_SECONDS:-60}
  TAXIMOBILE_CASE_ALERT_MAX_DELIVERY_ATTEMPTS: ${TAXIMOBILE_CASE_ALERT_MAX_DELIVERY_ATTEMPTS:-8}
  TAXIMOBILE_CASE_PAGER_URL: ${TAXIMOBILE_CASE_PAGER_URL:?Set the protected HTTPS case-pager webhook through the deployment secret boundary}
  TAXIMOBILE_CASE_PAGER_TOKEN: ${TAXIMOBILE_CASE_PAGER_TOKEN:?Set a dedicated 32+ character case-pager bearer token through the deployment secret boundary}
  TAXIMOBILE_CASE_PAGER_TIMEOUT_SECONDS: ${TAXIMOBILE_CASE_PAGER_TIMEOUT_SECONDS:-5}
  TAXIMOBILE_CASE_RETENTION_POLL_SECONDS: ${TAXIMOBILE_CASE_RETENTION_POLL_SECONDS:-3600}
  TAXIMOBILE_CASE_RETENTION_BATCH_SIZE: ${TAXIMOBILE_CASE_RETENTION_BATCH_SIZE:-100}
  TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_DAYS: ${TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_DAYS:-730}
  TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_POLL_SECONDS: ${TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_POLL_SECONDS:-3600}
  TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_BATCH_SIZE: ${TAXIMOBILE_DRIVER_DOCUMENT_RETENTION_BATCH_SIZE:-100}

x-container-hardening: &container-hardening
  image: ${TAXIMOBILE_API_IMAGE:?Set an immutable API image reference including @sha256 digest}
  pull_policy: always
  user: "2000:2000"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *container-hardening
    profiles: [migration]
    environment:
      TAXIMOBILE_ENV: production
      TAXIMOBILE_DATABASE_URL: ${TAXIMOBILE_DATABASE_URL:?Set the managed PostgreSQL/PostGIS URL through the deployment secret boundary}
      TAXIMOBILE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${TAXIMOBILE_MIGRATION_LOCK_TIMEOUT_SECONDS-5}
      TAXIMOBILE_MIGRATION_STATEMENT_TIMEOUT_SECONDS: ${TAXIMOBILE_MIGRATION_STATEMENT_TIMEOUT_SECONDS-300}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *container-hardening
    environment:
      <<: *api-environment
      TAXIMOBILE_PROCESS_ROLE: api
      TAXIMOBILE_LOG_FILE: /var/log/taximobile/events.jsonl
    command:
      - uvicorn
      - taximobile_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # The application emits one privacy-bounded structured completion event;
      # Uvicorn's raw access event would duplicate it and may expose raw paths.
      - --no-access-log
      # One process per container keeps metrics scrapeable per replica.
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${TAXIMOBILE_TRUSTED_PROXY_CIDRS:?Set only the reverse proxy addresses/CIDRs}
    ports:
      - 127.0.0.1:${TAXIMOBILE_API_PORT:-8000}:8000
    volumes:
      - taximobile_driver_documents:/var/lib/taximobile/driver-documents
      - taximobile_api_logs:/var/log/taximobile
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      # Readiness includes the authoritative PostgreSQL dependency. Liveness is
      # intentionally left to the orchestrator's process/container state.
      test: ["CMD", "python", "-c", "import os, urllib.request; host=next(value.strip().lower() for value in os.environ['TAXIMOBILE_ALLOWED_HOSTS'].split(',') if value.strip()); request=urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': host}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *container-hardening
    environment:
      <<: *worker-environment
      TAXIMOBILE_PROCESS_ROLE: worker
      TAXIMOBILE_LOG_FILE: /var/log/taximobile/events.jsonl
    command:
      - uvicorn
      - taximobile_api.worker:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --no-access-log
      - --workers
      - "1"
    ports:
      # Private host-loopback operations surface for readiness and scraping.
      - 127.0.0.1:${TAXIMOBILE_WORKER_PORT:-8001}:8001
    volumes:
      - taximobile_driver_documents:/var/lib/taximobile/driver-documents
      - taximobile_worker_logs:/var/log/taximobile
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      # Worker readiness requires PostgreSQL, a running supervisor, and one
      # successful iteration from every fixed background loop.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  clamav:
    image: ${TAXIMOBILE_CLAMAV_IMAGE:?Set an immutable ClamAV image reference including @sha256 digest}
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/clamav:size=16m,mode=0755
    volumes:
      - taximobile_clamav_database:/var/lib/clamav
    expose:
      - "3310"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  taximobile_driver_documents:
  taximobile_clamav_database:
  taximobile_api_logs:
  taximobile_worker_logs:
