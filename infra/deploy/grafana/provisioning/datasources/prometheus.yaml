apiVersion: 1

prune: true

datasources:
  - name: TaxiMobile Prometheus
    type: prometheus
    uid: taximobile-prometheus
    orgId: 1
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      timeInterval: 15s
      manageAlerts: false

