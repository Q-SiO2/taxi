global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: taximobile
    environment: production

rule_files:
  - /etc/prometheus/rules/taximobile-alerts.yaml

alerting:
  # Alert labels are operational routing metadata, never business records. Drop
  # private dimensions defensively before any future rule reaches Alertmanager.
  alert_relabel_configs:
    - action: labeldrop
      regex: user_id|driver_id|passenger_id|device_id|ride_id|resource_id|authorization_id|payload|topic
  alertmanagers:
    - static_configs:
        - targets:
            - taximobile-alertmanager:9093

scrape_configs:
  - job_name: taximobile-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/taximobile_monitoring_token
    static_configs:
      - targets:
          - taximobile-api-metrics:8000
        labels:
          process_role: api

  - job_name: taximobile-worker
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/taximobile_monitoring_token
    static_configs:
      - targets:
          - taximobile-worker-metrics:8001
        labels:
          process_role: worker

  - job_name: taximobile-loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
        labels:
          process_role: log_store

  - job_name: taximobile-alloy
    metrics_path: /metrics
    static_configs:
      - targets:
          - alloy:12345
        labels:
          process_role: log_collector
