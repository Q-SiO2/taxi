worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Match the backend's maximum 20 MiB document bound plus multipart framing.
    client_max_body_size 21m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
    # Filled from this container's own DNS configuration at startup. The current
    # API binds IPv4; this 2026 environment provides dual-stack private DNS.
    resolver @DNS_RESOLVER@ valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8080;
        # Railway terminates HTTPS; keep redirects relative to the public origin.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        location = /health { default_type text/plain; return 200 "ready\n"; }
        location ~ \.map$ { return 404; }
        location = /release-manifest.json { return 404; }
        location ~ /\. { return 404; }
        # WASM_ALIASES: filled from the validated release manifest at packaging.
        location /api/v1/ {
            # A variable forces runtime DNS refresh after an API redeployment.
            set $alpha_api http://alpha-api.railway.internal:8000;
            proxy_pass $alpha_api;
            proxy_connect_timeout 5s;
            proxy_http_version 1.1;
            proxy_set_header Host alpha-api-staging.up.railway.app;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_buffering off;
        }
        # The /apply surface uses relative resources; redirect to its trailing
        # slash form and serve the same hashed release under that path.
        location = /apply { return 302 /apply/; }
        location /apply/ {
            rewrite ^/apply/(.*)$ /$1 last;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
