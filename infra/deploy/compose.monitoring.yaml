services:
  api:
    networks:
      default: {}
      taximobile_monitoring:
        aliases:
          - taximobile-api-metrics

  worker:
    networks:
      default: {}
      taximobile_monitoring:
        aliases:
          - taximobile-worker-metrics

  prometheus:
    image: ${TAXIMOBILE_PROMETHEUS_IMAGE:?Set an immutable Prometheus image reference including @sha256 digest}
    pull_policy: always
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${TAXIMOBILE_PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${TAXIMOBILE_PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus-alerts.yaml:/etc/prometheus/rules/taximobile-alerts.yaml:ro
      - taximobile_prometheus_data:/prometheus
    secrets:
      - taximobile_monitoring_token
    networks:
      - taximobile_monitoring
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      loki:
        condition: service_healthy
      alloy:
        condition: service_healthy
    ports:
      - 127.0.0.1:${TAXIMOBILE_PROMETHEUS_PORT:-9090}:9090
    healthcheck:
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  loki:
    image: ${TAXIMOBILE_LOKI_IMAGE:?Set an immutable Loki image reference including @sha256 digest}
    pull_policy: always
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - -config.file=/etc/loki/taximobile.yaml
    volumes:
      - ./loki.yaml:/etc/loki/taximobile.yaml:ro
      - taximobile_loki_data:/loki
    networks:
      - taximobile_monitoring
    ports:
      - 127.0.0.1:${TAXIMOBILE_LOKI_PORT:-3100}:3100
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/taximobile.yaml", "-verify-config=true"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  alloy:
    image: ${TAXIMOBILE_ALLOY_IMAGE:?Set an immutable Alloy image reference including @sha256 digest}
    pull_policy: always
    user: "473:473"
    group_add:
      - "2000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - taximobile_api_logs:/var/log/taximobile-api:ro
      - taximobile_worker_logs:/var/log/taximobile-worker:ro
      - taximobile_alloy_data:/var/lib/alloy/data
    networks:
      - taximobile_monitoring
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - 127.0.0.1:${TAXIMOBILE_ALLOY_PORT:-12345}:12345
    healthcheck:
      test: ["CMD", "/bin/alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  alertmanager:
    image: ${TAXIMOBILE_ALERTMANAGER_IMAGE:?Set an immutable Alertmanager image reference including @sha256 digest}
    pull_policy: always
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
      - --data.retention=${TAXIMOBILE_ALERTMANAGER_RETENTION:-120h}
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - taximobile_alertmanager_data:/alertmanager
    secrets:
      - taximobile_platform_alert_webhook_url
      - taximobile_dispatch_alert_webhook_url
      - taximobile_scheduling_alert_webhook_url
      - taximobile_driver_compliance_alert_webhook_url
    networks:
      taximobile_monitoring:
        aliases:
          - taximobile-alertmanager
      taximobile_alert_egress: {}
    ports:
      - 127.0.0.1:${TAXIMOBILE_ALERTMANAGER_PORT:-9093}:9093
    healthcheck:
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  grafana:
    image: ${TAXIMOBILE_GRAFANA_IMAGE:?Set an immutable Grafana image reference including @sha256 digest}
    pull_policy: always
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/log/grafana:size=32m,mode=0750,uid=472,gid=472
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: taximobile-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/taximobile_grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_BASIC_PASSWORD_POLICY: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - taximobile_grafana_data:/var/lib/grafana
    secrets:
      - taximobile_grafana_admin_password
    networks:
      - taximobile_monitoring
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - 127.0.0.1:${TAXIMOBILE_GRAFANA_PORT:-3000}:3000
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  taximobile_monitoring:
    internal: true
  taximobile_alert_egress: {}

volumes:
  taximobile_prometheus_data:
  taximobile_alertmanager_data:
  taximobile_grafana_data:
  taximobile_loki_data:
  taximobile_alloy_data:

secrets:
  taximobile_monitoring_token:
    file: ${TAXIMOBILE_MONITORING_TOKEN_FILE:?Set the monitoring-token secret file path}
  taximobile_platform_alert_webhook_url:
    file: ${TAXIMOBILE_PLATFORM_ALERT_WEBHOOK_URL_FILE:?Set the platform-duty webhook URL secret file path}
  taximobile_dispatch_alert_webhook_url:
    file: ${TAXIMOBILE_DISPATCH_ALERT_WEBHOOK_URL_FILE:?Set the dispatch webhook URL secret file path}
  taximobile_scheduling_alert_webhook_url:
    file: ${TAXIMOBILE_SCHEDULING_ALERT_WEBHOOK_URL_FILE:?Set the scheduling webhook URL secret file path}
  taximobile_driver_compliance_alert_webhook_url:
    file: ${TAXIMOBILE_DRIVER_COMPLIANCE_ALERT_WEBHOOK_URL_FILE:?Set the driver-compliance webhook URL secret file path}
  taximobile_grafana_admin_password:
    file: ${TAXIMOBILE_GRAFANA_ADMIN_PASSWORD_FILE:?Set the Grafana administrator password secret file path}
